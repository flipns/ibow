name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (Domain + Data)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test IBOWKit
        working-directory: Packages/IBOWKit
        run: swift test --enable-code-coverage --parallel
