name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (IBOWKit)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: swift test
        working-directory: Packages/IBOWKit
        run: swift test --enable-code-coverage --parallel

  app-tests:
    name: App build + tests
    runs-on: xcode-27
    needs: package-tests
    steps:
      - uses: actions/checkout@v5
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      - name: Use the on-screen keyboard (UI tests type into the search field)
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project IBOW.xcodeproj \
            -scheme IBOW \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
