name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (IBOWKit)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: swift test
        working-directory: Packages/IBOWKit
        run: swift test --enable-code-coverage --parallel

  app-tests:
    name: App build + tests
    runs-on: xcode-27
    needs: package-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      - name: Use the on-screen keyboard (UI tests type into the search field)
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: Boot the simulator and wait until it is ready
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "${{ steps.sim.outputs.name }} (" | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project IBOW.xcodeproj \
            -scheme IBOW \
            -destination "id=$UDID" \
            -enableCodeCoverage YES
      - name: Run tests (one retry if the runner crashes)
        timeout-minutes: 20
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf TestResults.xcresult
            if xcodebuild test-without-building \
              -project IBOW.xcodeproj \
              -scheme IBOW \
              -destination "id=$UDID" \
              -resultBundlePath TestResults.xcresult \
              -enableCodeCoverage YES; then
              exit 0
            fi
            echo "Attempt $attempt failed"
            xcrun simctl shutdown all || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
          done
          exit 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
